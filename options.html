<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PR Colors Settings</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 40px auto;
        }

        h1 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        input[type=text] {
            width: 100%;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        #status {
            color: green;
            margin-top: 16px;
            height: 20px;
        }
    </style>
</head>

<body>

<h1>PR Colors</h1>

<h2>Tag Rules</h2>
<table>
    <thead>
    <tr>
        <th>Tab text</th>
        <th>Badge color</th>
        <th></th>
    </tr>
    </thead>

    <tbody id="rules"></tbody>
</table>

<p>
    <button id="add">Add Rule</button>
</p>

<h2>PR Target Rules</h2>
<table>
    <thead>
    <tr>
        <th>Target branch text</th>
        <th>Highlight color</th>
        <th></th>
    </tr>
    </thead>

    <tbody id="prTargetRules"></tbody>
</table>

<p>
    <button id="addTarget">Add Target Rule</button>
</p>

<h2>PR Name Rules</h2>
<table>
    <thead>
    <tr>
        <th>PR Name text</th>
        <th>Highlight color</th>
        <th></th>
    </tr>
    </thead>

    <tbody id="prNameRules"></tbody>
</table>

<p>
    <button id="addPrName">Add Target Rule</button>
</p>

<div id="status"></div>

<script src="defaults.js"></script>
<script src="options.js"></script>

</body>
</html>
